packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Native binary for the Tailwind v4 oxide engine.
  '@tailwindcss/oxide': true
  lightningcss: true
# The RC pairs must be exact. Nativewind delegates CSS parsing to lightningcss, and
# the install guide pins it because newer builds fail to deserialize global.css.
overrides:
  lightningcss: 1.30.1
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.16 || 57.0.25'
  - '@expo/config@57.0.8'
  - '@expo/fingerprint@0.20.8'
  - '@expo/inline-modules@0.1.6'
  - '@expo/log-box@57.0.3'
  - expo-asset@57.0.12
  - expo-constants@57.0.12
  - expo@57.0.14 || 57.0.23
  - '@expo/metro-runtime@57.0.11'
  - expo-router@57.0.14
  - expo-splash-screen@57.0.7
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo-location@57.0.18
  - expo-task-manager@57.0.18